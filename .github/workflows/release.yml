name: Build and Release Native Rust App

# A release is published only when everything before it succeeded: the tag
# equals the version in native/Cargo.toml, CHANGELOG.md has a section for it,
# the tests pass on all three systems, and every package was built, installed
# and started. Nothing is created on the release page until then, so a failed
# run leaves no draft with half the files.

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version tag (for example v1.0.0); must equal the version in native/Cargo.toml'
        required: true
      draft_only:
        description: 'Leave the release as a draft to look at before publishing'
        type: boolean
        required: false
        default: false

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.version.outputs.tag }}
      number: ${{ steps.version.outputs.number }}
      prerelease: ${{ steps.version.outputs.prerelease }}
    steps:
      - uses: actions/checkout@v4
      - name: Check the version against the tag
        id: version
        env:
          REQUESTED: ${{ github.event_name == 'workflow_dispatch' && inputs.version || github.ref_name }}
        run: |
          [[ "$REQUESTED" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.]+)?$ ]] \
            || { echo "::error::'$REQUESTED' is not a version tag like v1.2.3 or v1.2.3-rc1"; exit 1; }
          bash native/packaging/version.sh "$REQUESTED" | tee -a "$GITHUB_OUTPUT"
      - name: Check that the changelog describes this version
        run: bash native/packaging/release-notes.sh --check "${{ steps.version.outputs.number }}"
      # A published release is not replaced; a draft left by an earlier run is.
      - name: Check that this version is not published yet
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          if state=$(gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json isDraft --jq .isDraft 2>/dev/null) \
            && [[ "$state" != "true" ]]; then
            echo "::error::release $TAG is already published"
            exit 1
          fi

  checks:
    needs: prepare
    uses: ./.github/workflows/ci.yml

  packages:
    needs: prepare
    uses: ./.github/workflows/packages.yml
    with:
      version: ${{ needs.prepare.outputs.number }}
    # The Windows signing steps read their keys from the secrets.
    secrets: inherit

  publish:
    needs: [prepare, checks, packages]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      # For the build attestations of the Linux packages: a token to sign
      # them with, and the right to store them with the repository.
      id-token: write
      attestations: write
    env:
      GH_TOKEN: ${{ github.token }}
      TAG: ${{ needs.prepare.outputs.tag }}
      NUMBER: ${{ needs.prepare.outputs.number }}
    steps:
      - uses: actions/checkout@v4
      # The packages of every system, and package-open-cad-studio-source: the
      # source of the Open CAD Studio they carry, which is GPL-3.0, and of the
      # crates it takes from git repositories, some under the MPL-2.0 or the
      # LGPL; both go on the release page with them (expected-assets.sh lists
      # them last).
      - uses: actions/download-artifact@v4
        with:
          pattern: package-*
          path: assets
          merge-multiple: true
      - name: Check that the release is complete
        working-directory: assets
        run: |
          missing=0
          for name in $(bash ../native/packaging/expected-assets.sh "$NUMBER"); do
            for file in "$name" "$name.sha256"; do
              if [[ ! -s "$file" ]]; then
                echo "::error::$file is missing"
                missing=1
              fi
            done
          done
          [[ "$missing" -eq 0 ]]
          for sum in *.sha256; do sha256sum -c "$sum"; done
          ls -l
      # Every Linux package gets a build attestation, signed through Sigstore
      # and kept by GitHub. `gh attestation verify FILE --repo OWNER/REPO
      # --signer-workflow OWNER/REPO/.github/workflows/release.yml` then
      # checks that this workflow attested the file and that it has not
      # changed since; its output names the tag or branch the run was for.
      # It comes before anything is put on the release page, so a failure
      # leaves nothing behind.
      - name: Attest the Linux packages
        uses: actions/attest@v4
        with:
          subject-path: |
            assets/*.deb
            assets/*.AppImage
            assets/*_linux-*.tar.gz
      - name: Write the release notes
        env:
          WINDOWS_SIGNED: ${{ needs.packages.outputs.windows_signed }}
        run: bash native/packaging/release-notes.sh "$NUMBER" > notes.md
      # A draft left by an earlier run is taken over and moved to this commit.
      - name: Create the draft release
        env:
          PRERELEASE: ${{ needs.prepare.outputs.prerelease }}
        run: bash native/packaging/draft-release.sh "$TAG" notes.md "$PRERELEASE"
      - name: Upload the packages
        working-directory: assets
        run: |
          for name in $(bash ../native/packaging/expected-assets.sh "$NUMBER"); do
            gh release upload "$TAG" "$name" "$name.sha256" --clobber --repo "$GITHUB_REPOSITORY"
          done
      # A draft taken over from an earlier run keeps what that run uploaded,
      # such as the source archives of Open CAD Studio for a commit pinned
      # before; whatever this release does not hold goes.
      - name: Remove the files of an earlier run from the draft
        run: bash native/packaging/prune-release-assets.sh "$TAG" "$NUMBER"
      - name: Publish the release
        if: ${{ !inputs.draft_only }}
        run: gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" --draft=false
