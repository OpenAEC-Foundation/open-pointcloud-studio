name: Build and Release Native Rust App

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version tag (for example v1.0.0)'
        required: true

permissions:
  contents: write

jobs:
  create-release:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.value }}
    steps:
      - name: Resolve version
        id: version
        shell: bash
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          if [[ "$GITHUB_EVENT_NAME" == "workflow_dispatch" ]]; then
            version="$INPUT_VERSION"
          else
            version="$GITHUB_REF_NAME"
          fi
          [[ "$version" =~ ^v[0-9]+\.[0-9]+\.[0-9]+([.-][A-Za-z0-9.-]+)?$ ]] || exit 1
          echo "value=$version" >> "$GITHUB_OUTPUT"
      - name: Create draft release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.value }}
        run: |
          if ! gh release view "$VERSION" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release create "$VERSION" --repo "$GITHUB_REPOSITORY" --draft \
              --title "Open Pointcloud Studio $VERSION" \
              --notes "Native Rust desktop application for Windows, Linux and macOS. Each archive holds the application binary and the licence texts; no installer, web frontend or webview is involved. The desktop application is GPL-3.0-only, the point-cloud core LGPL-3.0-or-later."
          fi

  build-native:
    needs: create-release
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: ubuntu-22.04
            artifact: linux
            binary: open-pointcloud-studio
          - platform: windows-latest
            artifact: windows
            binary: open-pointcloud-studio.exe
          - platform: macos-latest
            artifact: macos
            binary: open-pointcloud-studio
    runs-on: ${{ matrix.platform }}
    defaults:
      run:
        working-directory: native
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Install Linux desktop dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config libxkbcommon-dev libwayland-dev libx11-dev libgtk-3-dev
      - name: Build native binary
        run: cargo build --release --locked -p open-pointcloud-studio-native
      # An unsigned binary still works; signing only spares users a warning.
      - name: Sign Windows binary
        if: matrix.artifact == 'windows'
        continue-on-error: true
        uses: azure/trusted-signing-action@v0.5.0
        with:
          azure-tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          azure-client-id: ${{ secrets.AZURE_CLIENT_ID }}
          azure-client-secret: ${{ secrets.AZURE_CLIENT_SECRET }}
          endpoint: ${{ secrets.AZURE_ENDPOINT }}
          trusted-signing-account-name: ${{ secrets.AZURE_TRUSTED_SIGNING_ACCOUNT_NAME }}
          certificate-profile-name: ${{ secrets.AZURE_CERTIFICATE_PROFILE_NAME }}
          files-folder: ${{ github.workspace }}/native/target/release
          files-folder-filter: exe
          files-folder-depth: 1
          file-digest: SHA256
          timestamp-rfc3161: http://timestamp.acs.microsoft.com
          timestamp-digest: SHA256
      - name: Package and upload native binary
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.create-release.outputs.version }}
          PLATFORM: ${{ matrix.artifact }}
          BINARY: ${{ matrix.binary }}
        run: |
          package="open-pointcloud-studio-${VERSION}-${PLATFORM}"
          mkdir "$package"
          cp "target/release/$BINARY" "$package/"
          # The licences travel with every copy of the binary.
          cp ../LICENSE.md "$package/LICENSE-LGPL-3.0.md"
          cp desktop/LICENSE-GPL-3.0 "$package/LICENSE-GPL-3.0.txt"
          cp assets/fonts/*-OFL.txt "$package/"
          cat > "$package/NOTICE.txt" <<'NOTICE'
          Open Pointcloud Studio

          The desktop application is licensed GPL-3.0-only (LICENSE-GPL-3.0.txt).
          It contains ribbon and properties-panel code and icons adapted from a
          GPL-3.0 project that is credited in the source headers and in
          native/README.md of the source repository. The point-cloud core is
          licensed LGPL-3.0-or-later (LICENSE-LGPL-3.0.md).

          The embedded fonts Inter and Space Grotesk are licensed under the SIL
          Open Font License (the *-OFL.txt files).

          Source code: https://github.com/OpenAEC-Foundation/open-pointcloud-studio
          NOTICE
          if [[ "$PLATFORM" == "windows" ]]; then
            archive="$package.zip"
            7z a -bso0 "$archive" "$package"
          else
            archive="$package.tar.gz"
            tar -czf "$archive" "$package"
          fi
          if command -v sha256sum >/dev/null 2>&1; then
            sha256sum "$archive" > "$archive.sha256"
          else
            shasum -a 256 "$archive" > "$archive.sha256"
          fi
          gh release upload "$VERSION" "$archive" "$archive.sha256" --clobber --repo "$GITHUB_REPOSITORY"

  publish-release:
    needs: [create-release, build-native]
    runs-on: ubuntu-latest
    steps:
      # A draft cannot be looked up by its tag through the API, so publish it
      # with the command-line client, which finds drafts by name.
      - name: Publish completed release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.create-release.outputs.version }}
        run: gh release edit "$VERSION" --repo "$GITHUB_REPOSITORY" --draft=false
