name: Build and Release Native Rust App

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version tag (for example v1.0.0)'
        required: true

permissions:
  contents: write

jobs:
  create-release:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.value }}
    steps:
      - name: Resolve version
        id: version
        shell: bash
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          if [[ "$GITHUB_EVENT_NAME" == "workflow_dispatch" ]]; then
            version="$INPUT_VERSION"
          else
            version="$GITHUB_REF_NAME"
          fi
          [[ "$version" =~ ^v[0-9]+\.[0-9]+\.[0-9]+([.-][A-Za-z0-9.-]+)?$ ]] || exit 1
          echo "value=$version" >> "$GITHUB_OUTPUT"
      - name: Create draft release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.value }}
        run: |
          if ! gh release view "$VERSION" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release create "$VERSION" --repo "$GITHUB_REPOSITORY" --draft \
              --title "Open Pointcloud Studio $VERSION" \
              --notes "Native Rust desktop build. These archives contain the application binary; no Tauri frontend or webview is included."
          fi

  build-native:
    needs: create-release
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: ubuntu-22.04
            artifact: linux
            binary: open-pointcloud-studio-native
          - platform: windows-latest
            artifact: windows
            binary: open-pointcloud-studio-native.exe
          - platform: macos-latest
            artifact: macos
            binary: open-pointcloud-studio-native
    runs-on: ${{ matrix.platform }}
    defaults:
      run:
        working-directory: native
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Install Linux desktop dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config libxkbcommon-dev libwayland-dev libx11-dev libgtk-3-dev
      - name: Build native binary
        run: cargo build --release --locked -p open-pointcloud-studio-native
      - name: Package and upload native binary
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.create-release.outputs.version }}
          PLATFORM: ${{ matrix.artifact }}
          BINARY: ${{ matrix.binary }}
        run: |
          archive="open-pointcloud-studio-native-${VERSION}-${PLATFORM}.tar.gz"
          tar -czf "$archive" -C target/release "$BINARY"
          gh release upload "$VERSION" "$archive" --clobber --repo "$GITHUB_REPOSITORY"

  publish-release:
    needs: [create-release, build-native]
    runs-on: ubuntu-latest
    steps:
      - name: Publish completed release
        uses: actions/github-script@v7
        env:
          VERSION: ${{ needs.create-release.outputs.version }}
        with:
          script: |
            const release = await github.rest.repos.getReleaseByTag({
              owner: context.repo.owner,
              repo: context.repo.repo,
              tag: process.env.VERSION,
            });
            await github.rest.repos.updateRelease({
              owner: context.repo.owner,
              repo: context.repo.repo,
              release_id: release.data.id,
              draft: false,
            });
