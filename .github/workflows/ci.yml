name: Native Rust CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  # The release workflow runs these checks before it publishes anything.
  workflow_call:

jobs:
  native:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: ubuntu-22.04
            artifact: linux
            binary: native/target/release/open-pointcloud-studio
          - platform: windows-latest
            artifact: windows
            binary: native/target/release/open-pointcloud-studio.exe
          - platform: macos-latest
            artifact: macos
            binary: native/target/release/open-pointcloud-studio
    runs-on: ${{ matrix.platform }}
    defaults:
      run:
        working-directory: native
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - name: Install Linux desktop dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config libxkbcommon-dev libwayland-dev libx11-dev
      - name: Test Rust workspace
        run: cargo test --workspace --locked
      - name: Check Rust code
        run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - name: Build native desktop application
        run: cargo build --release --locked -p open-pointcloud-studio-native
      - uses: actions/upload-artifact@v4
        with:
          name: open-pointcloud-studio-${{ matrix.artifact }}
          path: ${{ matrix.binary }}
          if-no-files-found: error
