[package]
name = "openaec-ui"
version = "0.1.0"
edition = "2021"
description = "Shared native OpenAEC desktop shell, design tokens and components"
license = "LGPL-3.0-only AND CC-BY-SA-4.0 AND OFL-1.1 AND Apache-2.0"
readme = "README.md"
include = ["src/**", "assets/fonts/**", "assets/icons/**", "assets/find-bar/**", "assets/domain-icons/**", "assets/domain-icons-small/**", "assets/ribbon-icons/**", "licenses/**", "Cargo.toml", "README.md", "LICENSE.md", "NOTICE.md"]

[features]
gpu-renderer = ["iced/wgpu"]

[dependencies]
iced = { version = "=0.13.1", default-features = false, features = ["tiny-skia", "svg", "image", "web-colors", "advanced", "fira-sans"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[dev-dependencies]
iced_tiny_skia = "0.13"
