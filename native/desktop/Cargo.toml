[package]
name = "open-pointcloud-studio-native"
version.workspace = true
edition.workspace = true
license = "GPL-3.0-only"

[[bin]]
name = "open-pointcloud-studio"
path = "src/main.rs"

[dependencies]
pointcloud-core = { path = "../core" }
# "web-colors" lays a colour with alpha over what lies under it as CSS does,
# so that the tokens of the OpenAEC style book look as its template shows them.
iced = { version = "0.13.1", features = ["advanced", "canvas", "image", "svg", "tokio", "web-colors"] }
iced_wgpu = "0.13.5"
bytemuck = { version = "1", features = ["derive"] }
rfd = "0.15"
tokio = { version = "1", features = ["rt", "sync"] }
tiny_http = "0.12"
uuid = { version = "1", features = ["v4"] }
open = "5.3"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "rustls-tls"] }
image = { version = "0.24", default-features = false, features = ["png", "jpeg"] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["float_roundtrip"] }
sysinfo = "0.33.1"
tempfile = "3"
rayon = "1"
flate2 = "1"
# Writes the PDF of a sheet. MIT OR Apache-2.0; its own dependencies are
# crates the lock file already holds.
pdf-writer = "0.14"

[target.'cfg(target_os = "linux")'.dependencies]
x11rb = "0.13"

# Receiving the files macOS hands to the application, and reading the language
# the user chose for the system. The versions are the ones the file dialogs
# already bring in, so the lock file gains no package.
[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-app-kit = { version = "0.3", default-features = false, features = ["std", "NSApplication", "NSResponder"] }
objc2-foundation = { version = "0.3", default-features = false, features = ["std", "NSArray", "NSDictionary", "NSLocale", "NSObject", "NSString", "NSURL", "NSUserDefaults"] }

[build-dependencies]
winresource = "0.1"

# The software renderer the window falls back to: tests lay out and draw the
# whole window with it, without a window, to see where its parts lie. The
# version is the one iced already brings in, so the lock file gains no package.
[dev-dependencies]
iced_tiny_skia = "0.13"
# The pixels the software renderer draws into. The version is the one
# iced brings in.
tiny-skia = "0.11"
# Tests look whether a task holds work; iced keeps that part of its runtime
# to itself. The version is the one iced brings in.
iced_runtime = "0.13"
