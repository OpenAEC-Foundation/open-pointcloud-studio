[package]
name = "pointcloud-core"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
las = { version = "0.9.11", features = ["laz-parallel"] }
e57 = { version = "0.11.13", features = ["crc32c"] }
crc32c = "0.6"
uuid = { version = "1", features = ["v4"] }
tempfile = "3"
memmap2 = "0.9"
delaunator = "1"
earcutr = "0.5"
serde_json = "1"
serde = { version = "1", features = ["derive"] }
reqwest = { version = "0.12", default-features = false, features = ["blocking", "rustls-tls"] }
rayon = "1.12"
# DXF and DWG reader and writer behind the drawing export; MPL-2.0, see NOTICE.
cadcodec = { package = "acadrust", version = "0.5.5", default-features = false }
