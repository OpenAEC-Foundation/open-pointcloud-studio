AWSTemplateFormatVersion: '2010-09-09'
Description: >-
  The cloud API of Open Pointcloud Studio (open-pointcloud-studio-api) on
  Amazon ECS with AWS Fargate behind an Application Load Balancer, in a
  network of its own. The keys come from AWS Secrets Manager; the service
  never runs open here. See deploy/aws/README.md.

Metadata:
  AWS::CloudFormation::Interface:
    ParameterGroups:
      - Label:
          default: Service
        Parameters:
          - ImageUri
          - ApiKeysSecretArn
          - RegistryCredentialsSecretArn
          - DesiredCount
      - Label:
          default: Address and certificate
        Parameters:
          - HostName
          - CertificateArn
          - AllowedCidr
      - Label:
          default: Size and limits
        Parameters:
          - Cpu
          - Memory
          - EphemeralStorageGiB
          - MaxBodyMib
          - MaxOutputMib
          - ConcurrentCalls
          - WaitingRoom
          - TimeLimitSeconds
          - RayonThreads

Parameters:
  ImageUri:
    Type: String
    Description: >-
      The image with its digest, such as
      ghcr.io/openaec-foundation/open-pointcloud-studio-api@sha256:... (the
      digest is in the release notes).
    AllowedPattern: '^[a-z0-9.-]+(:[0-9]+)?/[a-z0-9._/-]+@sha256:[0-9a-f]{64}$'
    ConstraintDescription: an image by its digest, REGISTRY/NAME@sha256:<64 hex digits>
  HostName:
    Type: String
    Description: >-
      The host name of the service, which the certificate covers, such as
      pointcloud-api.example.org. Point it at the LoadBalancerDnsName output.
    AllowedPattern: '^[a-z0-9]([a-z0-9-]*[a-z0-9])?(\.[a-z0-9]([a-z0-9-]*[a-z0-9])?)+$'
  CertificateArn:
    Type: String
    Description: The ARN of the AWS Certificate Manager certificate for HostName, in this region.
    AllowedPattern: '^arn:aws[a-z-]*:acm:[a-z0-9-]+:[0-9]{12}:certificate/[0-9a-f-]+$'
  ApiKeysSecretArn:
    Type: String
    Description: >-
      The ARN of the Secrets Manager secret whose value is the comma-separated
      SHA-256 hex of the keys (OPENAEC_API_SLEUTELS).
    AllowedPattern: '^arn:aws[a-z-]*:secretsmanager:[a-z0-9-]+:[0-9]{12}:secret:.+$'
  RegistryCredentialsSecretArn:
    Type: String
    Default: ''
    Description: >-
      Optional: the ARN of a Secrets Manager secret with a username and password
      for the registry, while the image is not public. Empty: none.
    AllowedPattern: '^(|arn:aws[a-z-]*:secretsmanager:[a-z0-9-]+:[0-9]{12}:secret:.+)$'
  AllowedCidr:
    Type: String
    Default: 0.0.0.0/0
    Description: The addresses that may reach the load balancer, as a CIDR block.
    AllowedPattern: '^([0-9]{1,3}\.){3}[0-9]{1,3}/([0-9]|[12][0-9]|3[0-2])$'
  DesiredCount:
    Type: Number
    Default: 1
    MinValue: 0
    MaxValue: 10
    Description: The number of tasks; 0 stops the service.
  Cpu:
    Type: String
    Default: '4096'
    AllowedValues: ['2048', '4096']
    Description: The CPU units of the task (1024 = 1 vCPU).
  Memory:
    Type: String
    Default: '8192'
    AllowedValues: ['8192', '16384']
    Description: >-
      The memory of the task in MiB; also OPENAEC_API_GEHEUGEN_MIB, against
      which the service checks its worst case at start (docs/cloud-api.md).
  EphemeralStorageGiB:
    Type: Number
    Default: 50
    MinValue: 21
    MaxValue: 200
    Description: The disk of the task in GiB, which holds the work folders of the calls.
  MaxBodyMib:
    Type: Number
    Default: 64
    MinValue: 1
    MaxValue: 512
    Description: OPENAEC_API_MAX_LICHAAM_MIB, the largest request body.
  MaxOutputMib:
    Type: Number
    Default: 256
    MinValue: 1
    MaxValue: 1024
    Description: OPENAEC_API_MAX_UITKOMST_MIB, the largest result file before base64.
  ConcurrentCalls:
    Type: Number
    Default: 2
    MinValue: 1
    MaxValue: 64
    Description: OPENAEC_API_GELIJKTIJDIG, the calls computing at once per task.
  WaitingRoom:
    Type: Number
    Default: 4
    MinValue: 0
    MaxValue: 256
    Description: OPENAEC_API_WACHTRIJ, the large requests that may wait for a place.
  TimeLimitSeconds:
    Type: Number
    Default: 300
    MinValue: 1
    MaxValue: 300
    Description: >-
      OPENAEC_API_TIJDSLIMIET_S, the time a call may compute; at most 300,
      below the idle timeout of the load balancer (330 s).
  RayonThreads:
    Type: String
    Default: ''
    Description: >-
      Optional: RAYON_NUM_THREADS, the threads the calls of a task share.
      Empty: one per vCPU.
    AllowedPattern: '^([1-9][0-9]?)?$'

Conditions:
  HasRegistryCredentials: !Not [!Equals [!Ref RegistryCredentialsSecretArn, '']]
  HasRayonThreads: !Not [!Equals [!Ref RayonThreads, '']]

Resources:
  # ---- Network: two public subnets, no NAT gateway --------------------------

  Vpc:
    Type: AWS::EC2::VPC
    Properties:
      CidrBlock: 10.80.0.0/16
      EnableDnsSupport: true
      EnableDnsHostnames: true
      Tags:
        - Key: Name
          Value: !Sub '${AWS::StackName}'

  InternetGateway:
    Type: AWS::EC2::InternetGateway
    Properties:
      Tags:
        - Key: Name
          Value: !Sub '${AWS::StackName}'

  GatewayAttachment:
    Type: AWS::EC2::VPCGatewayAttachment
    Properties:
      VpcId: !Ref Vpc
      InternetGatewayId: !Ref InternetGateway

  SubnetA:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref Vpc
      CidrBlock: 10.80.0.0/24
      AvailabilityZone: !Select [0, !GetAZs '']
      MapPublicIpOnLaunch: false
      Tags:
        - Key: Name
          Value: !Sub '${AWS::StackName}-a'

  SubnetB:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref Vpc
      CidrBlock: 10.80.1.0/24
      AvailabilityZone: !Select [1, !GetAZs '']
      MapPublicIpOnLaunch: false
      Tags:
        - Key: Name
          Value: !Sub '${AWS::StackName}-b'

  RouteTable:
    Type: AWS::EC2::RouteTable
    Properties:
      VpcId: !Ref Vpc
      Tags:
        - Key: Name
          Value: !Sub '${AWS::StackName}'

  DefaultRoute:
    Type: AWS::EC2::Route
    DependsOn: GatewayAttachment
    Properties:
      RouteTableId: !Ref RouteTable
      DestinationCidrBlock: 0.0.0.0/0
      GatewayId: !Ref InternetGateway

  SubnetARoutes:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      SubnetId: !Ref SubnetA
      RouteTableId: !Ref RouteTable

  SubnetBRoutes:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      SubnetId: !Ref SubnetB
      RouteTableId: !Ref RouteTable

  # ---- Who may reach what ---------------------------------------------------

  LoadBalancerSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: HTTPS and the redirect from HTTP to the load balancer
      VpcId: !Ref Vpc
      SecurityGroupIngress:
        - Description: HTTPS
          IpProtocol: tcp
          FromPort: 443
          ToPort: 443
          CidrIp: !Ref AllowedCidr
        - Description: HTTP, redirected to HTTPS
          IpProtocol: tcp
          FromPort: 80
          ToPort: 80
          CidrIp: !Ref AllowedCidr

  ServiceSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: The service, reachable from the load balancer only
      VpcId: !Ref Vpc
      SecurityGroupIngress:
        - Description: The service port, from the load balancer
          IpProtocol: tcp
          FromPort: 8080
          ToPort: 8080
          SourceSecurityGroupId: !Ref LoadBalancerSecurityGroup

  # ---- Load balancer --------------------------------------------------------

  LoadBalancer:
    Type: AWS::ElasticLoadBalancingV2::LoadBalancer
    Properties:
      Type: application
      Scheme: internet-facing
      Subnets:
        - !Ref SubnetA
        - !Ref SubnetB
      SecurityGroups:
        - !Ref LoadBalancerSecurityGroup
      LoadBalancerAttributes:
        # Longer than the time limit of a call (TimeLimitSeconds, 300 s).
        - Key: idle_timeout.timeout_seconds
          Value: '330'
        - Key: routing.http.drop_invalid_header_fields.enabled
          Value: 'true'

  TargetGroup:
    Type: AWS::ElasticLoadBalancingV2::TargetGroup
    Properties:
      TargetType: ip
      Protocol: HTTP
      Port: 8080
      VpcId: !Ref Vpc
      HealthCheckProtocol: HTTP
      HealthCheckPath: /v1/health
      HealthCheckIntervalSeconds: 30
      HealthCheckTimeoutSeconds: 10
      HealthyThresholdCount: 2
      UnhealthyThresholdCount: 5
      Matcher:
        HttpCode: '200'
      TargetGroupAttributes:
        # A call that runs when its task is replaced may finish.
        - Key: deregistration_delay.timeout_seconds
          Value: '330'

  HttpsListener:
    Type: AWS::ElasticLoadBalancingV2::Listener
    Properties:
      LoadBalancerArn: !Ref LoadBalancer
      Port: 443
      Protocol: HTTPS
      SslPolicy: ELBSecurityPolicy-TLS13-1-2-2021-06
      Certificates:
        - CertificateArn: !Ref CertificateArn
      # A path outside the API gets the JSON 404 of the service.
      DefaultActions:
        - Type: fixed-response
          FixedResponseConfig:
            StatusCode: '404'
            ContentType: application/json
            MessageBody: '{"error_code":"ROUTE_ONBEKEND","melding":"No such route.","remedie":"See /v1/openapi.json."}'

  ApiRule:
    Type: AWS::ElasticLoadBalancingV2::ListenerRule
    Properties:
      ListenerArn: !Ref HttpsListener
      Priority: 1
      Conditions:
        - Field: path-pattern
          PathPatternConfig:
            Values:
              - /v1/*
              - /mcp
      Actions:
        - Type: forward
          TargetGroupArn: !Ref TargetGroup

  HttpListener:
    Type: AWS::ElasticLoadBalancingV2::Listener
    Properties:
      LoadBalancerArn: !Ref LoadBalancer
      Port: 80
      Protocol: HTTP
      DefaultActions:
        - Type: redirect
          RedirectConfig:
            Protocol: HTTPS
            Port: '443'
            StatusCode: HTTP_301

  # ---- The service ----------------------------------------------------------

  LogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: /openaec/open-pointcloud-studio-api
      RetentionInDays: 30

  # Used by ECS to pull the image, read the secrets and write the log. The
  # task itself has no role: the service calls no AWS service.
  ExecutionRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: ecs-tasks.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: open-pointcloud-studio-api-execution
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - logs:CreateLogStream
                  - logs:PutLogEvents
                Resource: !GetAtt LogGroup.Arn
              - Effect: Allow
                Action: secretsmanager:GetSecretValue
                Resource: !If
                  - HasRegistryCredentials
                  - [!Ref ApiKeysSecretArn, !Ref RegistryCredentialsSecretArn]
                  - [!Ref ApiKeysSecretArn]

  Cluster:
    Type: AWS::ECS::Cluster
    Properties:
      CapacityProviders:
        - FARGATE
      DefaultCapacityProviderStrategy:
        - CapacityProvider: FARGATE
          Weight: 1

  TaskDefinition:
    Type: AWS::ECS::TaskDefinition
    Properties:
      Family: open-pointcloud-studio-api
      RequiresCompatibilities:
        - FARGATE
      NetworkMode: awsvpc
      RuntimePlatform:
        OperatingSystemFamily: LINUX
        CpuArchitecture: X86_64
      Cpu: !Ref Cpu
      Memory: !Ref Memory
      EphemeralStorage:
        SizeInGiB: !Ref EphemeralStorageGiB
      ExecutionRoleArn: !GetAtt ExecutionRole.Arn
      # The work folders of the calls; the image owns /work, so the volume
      # takes its owner (deploy/aws/README.md, "Volume ownership").
      Volumes:
        - Name: work
      ContainerDefinitions:
        - Name: api
          Image: !Ref ImageUri
          Essential: true
          User: '10001:10001'
          ReadonlyRootFilesystem: true
          PortMappings:
            - ContainerPort: 8080
              Protocol: tcp
          MountPoints:
            - SourceVolume: work
              ContainerPath: /work
              ReadOnly: false
          Environment:
            - Name: OPENAEC_MCP_HTTP
              Value: 0.0.0.0:8080
            - Name: OPENAEC_MCP_LOG
              Value: info
            - Name: OPENAEC_API_LOGVORM
              Value: json
            - Name: OPENAEC_API_WERKMAP
              Value: /work
            - Name: TMPDIR
              Value: /work/tmp
            - Name: OPENAEC_API_GEHEUGEN_MIB
              Value: !Ref Memory
            - Name: OPENAEC_API_MAX_LICHAAM_MIB
              Value: !Ref MaxBodyMib
            - Name: OPENAEC_API_MAX_UITKOMST_MIB
              Value: !Ref MaxOutputMib
            - Name: OPENAEC_API_GELIJKTIJDIG
              Value: !Ref ConcurrentCalls
            - Name: OPENAEC_API_WACHTRIJ
              Value: !Ref WaitingRoom
            - Name: OPENAEC_API_TIJDSLIMIET_S
              Value: !Ref TimeLimitSeconds
            - !If
              - HasRayonThreads
              - Name: RAYON_NUM_THREADS
                Value: !Ref RayonThreads
              - !Ref AWS::NoValue
          Secrets:
            - Name: OPENAEC_API_SLEUTELS
              ValueFrom: !Ref ApiKeysSecretArn
          RepositoryCredentials: !If
            - HasRegistryCredentials
            - CredentialsParameter: !Ref RegistryCredentialsSecretArn
            - !Ref AWS::NoValue
          HealthCheck:
            Command:
              - CMD
              - /usr/local/bin/open-pointcloud-studio-api
              - --health-check
            Interval: 30
            Timeout: 10
            Retries: 5
            StartPeriod: 30
          # Time for the running calls to end after SIGTERM.
          StopTimeout: 120
          LinuxParameters:
            InitProcessEnabled: true
          LogConfiguration:
            LogDriver: awslogs
            Options:
              awslogs-group: !Ref LogGroup
              awslogs-region: !Ref AWS::Region
              awslogs-stream-prefix: api

  Service:
    Type: AWS::ECS::Service
    DependsOn: ApiRule
    Properties:
      Cluster: !Ref Cluster
      LaunchType: FARGATE
      PlatformVersion: LATEST
      TaskDefinition: !Ref TaskDefinition
      DesiredCount: !Ref DesiredCount
      HealthCheckGracePeriodSeconds: 30
      DeploymentConfiguration:
        MinimumHealthyPercent: 100
        MaximumPercent: 200
        DeploymentCircuitBreaker:
          Enable: true
          Rollback: true
      # A public address to pull the image from the registry without a NAT
      # gateway; the security group admits the load balancer only.
      NetworkConfiguration:
        AwsvpcConfiguration:
          AssignPublicIp: ENABLED
          Subnets:
            - !Ref SubnetA
            - !Ref SubnetB
          SecurityGroups:
            - !Ref ServiceSecurityGroup
      LoadBalancers:
        - ContainerName: api
          ContainerPort: 8080
          TargetGroupArn: !Ref TargetGroup

Outputs:
  ServiceUrl:
    Description: The address of the service, for smoke.sh and the clients.
    Value: !Sub 'https://${HostName}'
  LoadBalancerDnsName:
    Description: The name that the DNS record of HostName points at (CNAME or alias).
    Value: !GetAtt LoadBalancer.DNSName
  LogGroupName:
    Description: The log of the service.
    Value: !Ref LogGroup
